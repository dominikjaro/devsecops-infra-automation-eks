apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: example
  namespace: online-boutique
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: mysql-credentials
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: MYSQL_CREDENTIALS